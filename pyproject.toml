[project]
name = "schiena"
version = "0.1.0"
description = "Improve your seated posture: your phone films you from the side, your Mac measures, Claude Code coaches."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "cryptography>=42",
    "qrcode>=7.4",
    "httpx>=0.27",
]

[project.scripts]
schiena = "schiena.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schiena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
